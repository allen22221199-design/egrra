/* 卡面視覺由程式生成。

.nw-th .ph{position:absolute;inset:0;background-size:cover;background-position:center}

  background:linear-gradient(180deg,rgba(15,12,9,.52),rgba(15,12,9,.18) 42%,rgba(15,12,9,.62))}

/* 圖說：明確說明這是自家實績照，不是新聞現場 —— 不寫的話讀者會誤以為是報導中的現場 */

<script>
(function(){
  var ITEMS=[], cur="全部";
  var elTabs=document.getElementById("tabs"), elList=document.getElementById("list"),
      elNote=document.getElementById("note"), ov=document.getElementById("nwov");
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function en(){return document.documentElement.getAttribute("data-lang")==="en";}
  function L(zh,e){return en()?e:zh;}
  function fmt(d){
    var t=Date.parse(d); if(isNaN(t))return "";
    var x=new Date(t);
    return x.getFullYear()+"/"+("0"+(x.getMonth()+1)).slice(-2)+"/"+("0"+x.getDate()).slice(-2);
  }

  /* 每個主題一款圖示與底紋。
     RSS 不提供圖片，而借用各家媒體的新聞配圖是侵權，所以自己畫。 */
  var ICON={
    /* 挖土機鏟斗 */
    "土方與工期":'<path d="M2 20h20"/><path d="M4 20v-4h6v4"/><path d="M10 16l3-7h4l2 4"/><path d="M13 9V5h3"/><circle cx="7" cy="20" r="1.6"/>',
    /* 門與火焰 */
    "防火法規":'<rect x="4" y="3" width="10" height="18" rx="1"/><path d="M11 12h.01"/><path d="M19 8c1.6 1.6 2.4 3.2 2.4 4.8A2.4 2.4 0 0 1 19 15a2.4 2.4 0 0 1-2.4-2.2c0-1.6.8-3.2 2.4-4.8z"/>',
    /* 盾牌內火焰 */
    "耐燃安全":'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M12 8c1.6 1.7 2.4 3 2.4 4.2A2.4 2.4 0 0 1 12 14.6a2.4 2.4 0 0 1-2.4-2.4C9.6 11 10.4 9.7 12 8z"/>',
    /* 葉片與循環 */
    "綠建材低碳":'<path d="M20 4c0 8-5 13-12 13H5"/><path d="M5 17c0-6 4-9 9-9"/><path d="M4 20c1-2 2-3 3-3.6"/>',
    /* 立面與量測 */
    "室內設計":'<path d="M3 21h18M5 21V8l7-5 7 5v13"/><rect x="9" y="12" width="6" height="9"/><path d="M9 12h6"/>',
    /* 兩棟樓與工具 */
    "公設與都更":'<path d="M3 21V8l5-3 5 3v13"/><path d="M14 21v-8h7v8"/><path d="M6 11h2M6 15h2M17 17h1"/>',
    /* 屋內心形 */
    "健康建材":'<path d="M4 11l8-6 8 6v10H4z"/><path d="M12 18s-3-2-3-4.2A1.7 1.7 0 0 1 12 12.5a1.7 1.7 0 0 1 3 1.3c0 2.2-3 4.2-3 4.2z"/>'
  };
  var HUE={"土方與工期":32,"防火法規":8,"耐燃安全":18,"綠建材低碳":110,
           "室內設計":205,"公設與都更":260,"健康建材":160};
  function icon(t){ return ICON[t]||'<path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/>'; }

  /* 卡面優先用自己的案場照。
     不用圖庫照或 AI 生成圖，是因為新聞旁配一張不相干的照片，
     讀者會以為那就是報導中的現場 —— 一篇講火災的文章配上某棟大樓，
     等於暗示那棟樓失火了。用自家實績照則零授權風險、不會誤導，
     還順便展示做過的工程；圖說會註明是實績照而非新聞現場。
     找不到對應照片的主題（例如土方）就退回自製圖案。 */
  var TOPIC_CAT={
    "防火法規":["防火門"],
    "耐燃安全":["防火門","消防箱・檢修門"],
    "公設與都更":["全棟廊道","牆面・天花"],
    "室內設計":["牆面・天花"],
    "健康建材":["牆面・天花"],
    "綠建材低碳":["牆面・天花","全棟廊道"]
  };
  /* 2026-08-10：暫停使用自家案場照。
     放在別人的新聞旁邊會像在暗示「那是我們的案子出事」或硬蹭，
     使用者明確表示不要。改用網路可商用圖庫，但那需要 API 金鑰，
     取得之前先回到自製圖案 —— 寧可樸素，不要有誤導疑慮。
     金鑰備妥後把下面這行拿掉即可恢復。 */
  var USE_OWN_PHOTOS=false;
  var PHOTO=null;
  function photoFor(x){
    if(x.image)return {url:x.image,from:""};          /* 後台指定的優先 */
    if(!USE_OWN_PHOTOS)return null;
    var cats=TOPIC_CAT[x.topic]; if(!cats)return null;
    if(!PHOTO){
      PHOTO={};
      var D=(window.EGRRA_LOCAL&&EGRRA_LOCAL())||window.EGRRA_DEFAULT_DATA||{};
      (D.cases||[]).forEach(function(c){
        ((c.cats&&c.cats.length?c.cats:[c.category])||[]).forEach(function(t){
          if(!t||!c.img)return;
          (PHOTO[t]=PHOTO[t]||[]).push({url:c.img,title:c.title,cat:t});
        });
      });
    }
    var pool=[];
    cats.forEach(function(c){ pool=pool.concat(PHOTO[c]||[]); });
    if(!pool.length)return null;
    /* 依 id 取固定的一張，同一篇每次開都一樣，不會跳來跳去 */
    var h=0,k=String(x.id||x.title||"");
    for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;
    var p=pool[h%pool.length];
    return {url:p.url,from:p.title+"・"+p.cat};
  }
  /* 底紋：以主題色相產生的斜線與光暈，SVG 直接內嵌，不必額外載圖 */
  function pat(t){
    var h=HUE[t]!==undefined?HUE[t]:38;
    /* 斜線紋以主題色相畫，線條夠明顯才看得出是刻意設計而不是純黑底 */
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140">'+
      '<defs><pattern id="p" width="18" height="18" patternUnits="userSpaceOnUse" '+
      'patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="18" '+
      'stroke="hsl('+h+',55%,62%)" stroke-width="1.4" opacity="0.30"/></pattern></defs>'+
      '<rect width="140" height="140" fill="url(#p)"/></svg>';
    /* 三層：斜線紋 → 右上角光暈 → 主題色打底，一次寫在同一個 background */
    /* 一定要用單引號包 data URI —— 這段會塞進 style="..." 屬性裡，
       用雙引號的話第一個引號就把屬性截斷了，整組樣式都不會生效。 */
    return "background-image:url('data:image/svg+xml,"+encodeURIComponent(svg)+"'),"+
           'radial-gradient(70% 90% at 78% 8%, hsla('+h+',62%,52%,.42), transparent 62%),'+
           'linear-gradient(150deg, hsl('+h+',30%,19%), #14110d 68%);'+
           'background-size:140px, cover, cover;background-repeat:repeat,no-repeat,no-repeat';
  }
  function thumb(x,big){
    var ph=photoFor(x);
    if(ph){
      /* 網址用 &quot; 包起來 —— 屬性值會先做 HTML 解碼再交給 CSS，
         直接寫雙引號會把 style="..." 截斷，寫單引號則在這段字串裡難以跳脫 */
      return '<div class="ph" style="background-image:url(&quot;'+esc(ph.url)+'&quot;)"></div>'+
        (x.topic?'<span class="tp">'+esc(x.topic)+'</span>':"")+
        (big
          ? (ph.from?'<span class="cap">'+L("圖為本公司「"+ph.from+"」實績，非新聞現場",
                        "Photo: our own project — not the scene reported")+'</span>':"")
          : '<span class="dt">'+fmt(x.publishedAt)+'</span>'+
            (x.srcCount?'<span class="cnt">'+L("依 "+x.srcCount+" 則報導","from "+x.srcCount+" reports")+'</span>':""));
    }
    return '<div class="pat" style="'+pat(x.topic)+'"></div>'+
      '<div class="ic"><svg viewBox="0 0 24 24">'+icon(x.topic)+'</svg></div>'+
      (x.topic?'<span class="tp">'+esc(x.topic)+'</span>':"")+
      (big?"":
        '<span class="dt">'+fmt(x.publishedAt)+'</span>'+
        (x.srcCount?'<span class="cnt">'+L("依 "+x.srcCount+" 則報導","from "+x.srcCount+" reports")+'</span>':""));
  }

  function draw(){
    var topics=["全部"].concat(ITEMS.map(function(x){return x.topic;})
      .filter(function(v,i,a){return v&&a.indexOf(v)===i;}));
    elTabs.innerHTML=topics.map(function(t){
      var n=t==="全部"?ITEMS.length:ITEMS.filter(function(x){return x.topic===t;}).length;
      return '<button class="nw-tab'+(t===cur?" on":"")+'" data-t="'+esc(t)+'">'+
             esc(t==="全部"?L("全部","All"):t)+' ('+n+')</button>';
    }).join("");
    var list=ITEMS.filter(function(x){return cur==="全部"||x.topic===cur;});
    if(!list.length){
      elList.innerHTML='<div class="nw-empty" style="grid-column:1/-1">'+
        L("目前還沒有發布的快訊，敬請期待。","No news published yet.")+'</div>';
      return;
    }
    elList.innerHTML=list.map(function(x,i){
      var first=String(x.body||"").split(/\n{2,}/)[0]||"";
      return '<article class="card nw-card" data-i="'+ITEMS.indexOf(x)+'">'+
        '<div class="nw-th">'+thumb(x)+'</div>'+
        '<div class="cap"><h3>'+esc(x.title)+'</h3>'+
          '<p>'+esc(first)+'</p>'+
          '<div class="more">'+L("看完整內容 →","Read more →")+'</div>'+
        '</div></article>';
    }).join("");
  }

  function open(i){
    var x=ITEMS[i]; if(!x)return;
    document.getElementById("nwhd").innerHTML=thumb(x,true);
    var srcs=x.sources||[];
    document.getElementById("nwbody").innerHTML=
      '<div class="dt">'+fmt(x.publishedAt)+
        (x.srcCount?'　·　'+L("依 "+x.srcCount+" 則報導整理","compiled from "+x.srcCount+" reports"):"")+'</div>'+
      '<h2>'+esc(x.title)+'</h2>'+
      String(x.body||"").split(/\n{2,}/).map(function(p){
        return '<p class="tx">'+esc(p.trim())+'</p>';}).join("")+
      (srcs.length?'<div class="srcs"><b>'+L("參考來源","Sources")+'</b>'+
        srcs.map(function(s){
          return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener nofollow" title="'+
            esc(s.title||"")+'">'+esc(s.source||L("原文","Source"))+'</a>';
        }).join("")+
        (x.srcCount&&x.srcCount>srcs.length?
          '<span style="font-size:12px;color:var(--faint)">'+
          L("等 "+x.srcCount+" 則","of "+x.srcCount+" total")+'</span>':"")+
      '</div>':"")+
      '<p class="dis">'+disclaimer()+'</p>';
    ov.classList.add("show"); document.body.style.overflow="hidden";
  }
  function close(){ ov.classList.remove("show"); document.body.style.overflow=""; }
  document.getElementById("nwx").addEventListener("click",close);
  ov.addEventListener("click",function(e){ if(e.target===ov)close(); });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&ov.classList.contains("show"))close(); });
  elList.addEventListener("click",function(e){
    var c=e.target.closest("[data-i]"); if(c)open(parseInt(c.dataset.i,10));
  });
  elTabs.addEventListener("click",function(e){
    var b=e.target.closest("[data-t]"); if(!b)return;
    cur=b.dataset.t; draw();
  });

  function disclaimer(){
    return L("＊ 本文為煌盛興業自行撰寫，非轉載或改寫原始報導。事實部分依各參考來源之報導交叉整理，實際規定以主管機關公告為準；各參考來源之著作權屬其原始媒體所有。",
      "* Written by EGRRA — not a reproduction or rewrite of the original reports. Facts are cross-checked against the sources listed; official announcements take precedence. Copyright in each source remains with its publisher.");
  }

  fetch("/api/news").then(function(r){return r.json();}).then(function(d){
    ITEMS=(d&&d.items)||[];
    elNote.textContent=disclaimer()+(d&&d.updated?"　"+L("最後更新：","Last updated: ")+fmt(d.updated):"");
    draw();
  }).catch(function(){
    ITEMS=[]; draw();
    elNote.textContent=L("快訊暫時無法載入。","News could not be loaded right now.");
  });

  EGRRA_I18N.init({
    dict:{
      "nw.h1":"Industry News",
      "nw.lead":"Earthworks and schedule pressure, fire-door regulations, fire-rated material safety and other developments relevant to interior fit-out — written up by us, with sources at the end of each piece."
    },
    sel:[["#nw-h1","nw.h1"],["#nw-lead","nw.lead"]]
  });
  window.__redraw=function(){ draw(); close();
    var n=document.getElementById("note"); if(n)n.textContent=disclaimer(); };

  var bg=document.querySelector(".burger");
  if(bg)bg.addEventListener("click",function(){document.querySelector(".nav-links").classList.toggle("open");});
})();
</script>
</body>
</html>
