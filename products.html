/* 花色編碼：跟在名稱後面的小字，方便客戶報型號 */

<script>
(function(){
  var T=window.EGRRA_TEX;
  var DATA=(window.EGRRA_LOCAL&&window.EGRRA_LOCAL())||window.EGRRA_DEFAULT_DATA||{products:[]};
  var PRODUCTS=DATA.products||[];
  var seriesList=["全部"].concat(uniq(PRODUCTS.map(function(p){return p.series;})));
  var tones=[{key:"全部",label:"全部"}].concat(T.TONES.map(function(t){return {key:t.key,label:t.label};}));
  var state={series:"全部",tone:"全部"};

  function uniq(a){var o=[],s={};a.forEach(function(x){if(x&&!s[x]){s[x]=1;o.push(x);}});return o;}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function bg(p){return p.img?("url('"+p.img+"')"):T.tex(p.stone);}

  function chips(host,items,cur,onPick){
    host.innerHTML="";
    items.forEach(function(it){
      var val=it.key||it, lab=it.label||it;
      var b=document.createElement("button");b.className="fchip"+(val===cur?" on":"");b.textContent=I.t(lab);
      b.addEventListener("click",function(){onPick(val);});
      host.appendChild(b);
    });
  }
  function renderChips(){
    chips(document.getElementById("f-series"),seriesList,state.series,function(v){state.series=v;render();});
    chips(document.getElementById("f-tone"),tones,state.tone,function(v){state.tone=v;render();});
  }
  function match(p){
    if(state.series!=="全部"&&p.series!==state.series)return false;
    if(state.tone!=="全部"&&T.toneOf(p)!==state.tone)return false;   /* 傳整個產品，讓它優先用自訂的 tone */
    return true;
  }
  /* 中英切換：動態字串經 I 翻譯（zh 模式原樣傳回） */
  var I=window.EGRRA_I18N||{t:function(s){return s;},pname:function(s){return s;},en:function(){return false;}};

  function render(){
    renderChips();
    var grid=document.getElementById("grid");grid.innerHTML="";
    var list=PRODUCTS.filter(match);
    document.getElementById("count").textContent=I.en()?(list.length+" colours"):("共 "+list.length+" 款");
    if(!list.length){grid.innerHTML='<div class="noresult">'+(I.en()?"No colours match — try different filters 🙂":"找不到符合的花色，換個條件看看 🙂")+'</div>';return;}
    list.forEach(function(p){
      var c=document.createElement("div");c.className="card";
      /* 背景圖先不套用，交給下面的 IntersectionObserver 捲到附近才載入。
         花色 130 款、每張約 110KB，全部一次載入要 14MB，手機開這頁會很久。 */
      c.innerHTML='<div class="th" data-bg="'+esc(bg(p))+'"><span class="tag">'+esc(I.t(p.series||""))+'</span></div>'+
                  '<div class="cap"><h3>'+esc(I.pname(p.name))+'</h3>'+
                  (p.code?'<span class="code">'+esc(p.code)+'</span>':"")+
                  '<p>'+esc(I.t(p.sizes||""))+'</p></div>';
      c.addEventListener("click",function(){openModal(p);});
      grid.appendChild(c);
    });
    lazyBg();
  }

  /* 延遲載入：進入視窗前 400px 才把背景圖掛上去；不支援 IO 的瀏覽器直接全載 */
  var io=null;
  function lazyBg(){
    var els=document.querySelectorAll(".th[data-bg]");
    if(!("IntersectionObserver" in window)){
      [].forEach.call(els,function(el){el.style.backgroundImage=el.dataset.bg;el.removeAttribute("data-bg");});
      return;
    }
    if(!io)io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting)return;
        var el=e.target;
        el.style.backgroundImage=el.dataset.bg;
        el.removeAttribute("data-bg");
        io.unobserve(el);
      });
    },{rootMargin:"400px"});
    [].forEach.call(els,function(el){io.observe(el);});
  }

  var ov=document.getElementById("ov");
  var curP=null;
  function openModal(p){
    curP=p;
    document.getElementById("m-img").style.backgroundImage=bg(p);
    document.getElementById("m-series").textContent=I.t(p.series||"藝格板");
    document.getElementById("m-name").textContent=I.pname(p.name||"");
    document.getElementById("m-desc").textContent=p.desc||(I.en()
      ?"Produced with patented PrinTex™ digital texture — a high-fidelity reproduction of natural materials. Substrate and size can be customized."
      :"以 PrinTex™ 專利數位紋理技術製作，高仿真還原天然質感，可依需求客製基材與尺寸。");
    document.getElementById("m-spec").innerHTML=
      (p.code?row(I.t("花色編碼"),p.code):"")+
      row(I.t("尺寸"),I.t(p.sizes||"4×4 / 4×8 / 4×10 / 5×10 尺"))+
      row(I.t("表面處理"),I.t(p.finish||"立體紋路・霧光・平光・消光"))+
      row(I.t("計價"),I.t(p.priceUnit||"以才計價，依需求數量報價"));
    /* 相關花色（同系列，最多 5 款）*/
    var rel=PRODUCTS.filter(function(x){return x.series===p.series&&x.name!==p.name;}).slice(0,5);
    var relHtml="";
    if(rel.length){relHtml='<h4>'+esc(I.t("同系列花色"))+'</h4><div class="mrel-items">'+rel.map(function(r){
      return '<div class="ri" title="'+esc(I.pname(r.name))+'" style="background-image:'+bg(r)+'" data-name="'+esc(r.name)+'"></div>';}).join("")+'</div>';}
    var relBox=document.getElementById("m-rel");relBox.innerHTML=relHtml;
    relBox.querySelectorAll(".ri").forEach(function(ri){ri.addEventListener("click",function(){
      var t=PRODUCTS.filter(function(x){return x.name===ri.dataset.name;})[0];if(t)openModal(t);});});
    ov.classList.add("show");
  }
  function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>';}
  document.getElementById("m-close").addEventListener("click",function(){ov.classList.remove("show");});
  ov.addEventListener("click",function(e){if(e.target===ov)ov.classList.remove("show");});

  /* ---- 紋理放大燈箱：點 modal 大圖 → 全螢幕看整張紋理 ---- */
  var plx=document.getElementById("plx");
  document.getElementById("m-img").addEventListener("click",function(){
    if(!curP)return;
    document.getElementById("plx-im").style.backgroundImage=bg(curP);
    document.getElementById("plx-cap").textContent=I.pname(curP.name||"")+(curP.series?"　·　"+I.t(curP.series):"");
    plx.classList.add("show");
  });
  function closePlx(){plx.classList.remove("show");}
  document.getElementById("plx-x").addEventListener("click",closePlx);
  plx.addEventListener("click",function(e){if(e.target===plx)closePlx();});
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape")return;
    if(plx.classList.contains("show"))closePlx();
    else ov.classList.remove("show");
  });

  window.__redraw=render;   /* 語言切換時由 i18n 呼叫重繪 */
  render();
})();
</script>
