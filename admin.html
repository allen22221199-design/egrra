<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>煌盛興業 EGRRA｜網站後台管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#20242b;--muted:#6b7280;--faint:#9aa1ac;
  --bg:#f3f4f6;--panel:#ffffff;--line:#e5e7eb;--line2:#eef0f3;
  --nav:#16130f;--nav2:#211c16;--gold:#b08d57;--gold-dk:#8f6f3f;--gold-lt:#c9a878;
  --ok:#1f9d6b;--danger:#d1495b;--warn:#c78a1e;
  --r:12px;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --sh:0 10px 30px -14px rgba(20,20,30,.22);
}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:inherit}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}

/* ---------- SIDEBAR ---------- */
.side{background:var(--nav);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:26px 24px 22px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .brand b{font-size:20px;font-weight:900;letter-spacing:.08em;display:block}
.side .brand span{font-size:10px;letter-spacing:.4em;color:var(--gold-lt);font-weight:600}
.side .brand small{display:block;margin-top:10px;font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.1em}
.navlist{padding:16px 12px;flex:1}
.navlist button{width:100%;display:flex;align-items:center;gap:13px;background:none;border:none;color:rgba(255,255,255,.72);
  padding:13px 15px;border-radius:10px;font-size:14.5px;font-weight:500;text-align:left;transition:.2s;margin-bottom:4px}
.navlist button:hover{background:rgba(255,255,255,.06);color:#fff}
.navlist button.on{background:linear-gradient(90deg,rgba(176,141,87,.22),rgba(176,141,87,.06));color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.navlist button .i{width:20px;height:20px;flex:0 0 auto}
.navlist button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.navlist .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:20px;color:rgba(255,255,255,.8)}
.side .foot{padding:16px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:rgba(255,255,255,.4)}
.side .foot a{color:var(--gold-lt);text-decoration:none}

/* ---------- MAIN ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:20}
.topbar h1{font-size:17px;font-weight:700;margin-right:auto}
.savestate{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px}
.savestate .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.savestate.dirty{color:var(--warn)}
.savestate.dirty .dot{background:var(--warn)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--faint);background:#fafafa}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{background:var(--gold-dk);border-color:var(--gold-dk)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.btn.danger{color:var(--danger);border-color:#f0d3d8}
.btn.danger:hover{background:#fdf2f4}

.content{padding:28px;max-width:1100px;width:100%}
.pagehead{margin-bottom:22px}
.pagehead h2{font-size:22px;font-weight:800}
.pagehead p{color:var(--muted);font-size:14px;margin-top:5px}

/* banner */
.notice{background:#fff7ea;border:1px solid #f0dcae;color:#8a6412;border-radius:var(--r);padding:14px 18px;font-size:13.5px;
  display:flex;gap:12px;margin-bottom:24px;line-height:1.7}
.notice b{color:#6b4c0c}
.notice svg{width:20px;height:20px;flex:0 0 auto;stroke:#c78a1e;fill:none;stroke-width:1.8;margin-top:2px}

/* card / panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.panel.pad{padding:26px}

/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}
.f{display:flex;flex-direction:column;gap:7px}
.f.full{grid-column:1/-1}
.f label{font-size:13px;font-weight:600;color:var(--ink)}
.f label span{color:var(--faint);font-weight:400}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fff;transition:.2s;color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,87,.13)}
.f textarea{resize:vertical;min-height:88px;line-height:1.7}
.f .hint{font-size:12px;color:var(--faint)}

/* toolbar for lists */
.listbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.search{flex:1;max-width:320px;position:relative}
.search input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 13px 10px 36px;background:#fff}
.search svg{position:absolute;left:11px;top:11px;width:17px;height:17px;stroke:var(--faint);fill:none;stroke-width:1.8}
.listbar .count{color:var(--muted);font-size:13px}

/* grid of item cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.25s;display:flex;flex-direction:column}
.item:hover{box-shadow:var(--sh);border-color:#dcdfe4;transform:translateY(-2px)}
.item .thumb{aspect-ratio:1/.72;background:#eee;position:relative;background-size:cover;background-position:center}
.item .thumb .tag{position:absolute;top:9px;left:9px;background:rgba(22,19,15,.8);color:#fff;font-size:11px;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.item .thumb .photo{position:absolute;top:9px;right:9px;background:var(--ok);color:#fff;font-size:10.5px;padding:3px 8px;border-radius:20px}
.item .thumb .nophoto{position:absolute;top:9px;right:9px;background:rgba(255,255,255,.85);color:var(--muted);font-size:10.5px;padding:3px 8px;border-radius:20px}
.item .body{padding:13px 14px;flex:1}
.item .body h4{font-size:15.5px;font-weight:700}
.item .body .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.item .act{display:flex;gap:8px;padding:0 14px 14px}
.item .act .btn{flex:1;justify-content:center}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,15,20,.5);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;
  padding:40px 20px;z-index:60;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 40px 80px -20px rgba(0,0,0,.4);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh h3{font-size:18px;font-weight:800}
.modal .mh .x{margin-left:auto;background:none;border:none;font-size:24px;color:var(--faint);line-height:1;padding:4px 8px;border-radius:8px}
.modal .mh .x:hover{background:#f3f4f6;color:var(--ink)}
.modal .mb{padding:26px}
.modal .mf{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end;background:#fafbfc;border-radius:0 0 16px 16px}

/* image upload */
.uploader{display:flex;gap:16px;align-items:center}
.preview{width:118px;height:88px;border-radius:10px;border:1px solid var(--line);background:#f6f6f6 center/cover no-repeat;flex:0 0 auto;position:relative;overflow:hidden}
.preview .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12px;text-align:center;padding:6px}
.up-actions{display:flex;flex-direction:column;gap:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:13px 22px;border-radius:11px;font-size:14px;box-shadow:0 16px 40px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:.35s;z-index:80;display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#15855a}.toast.err{background:#c23a4b}
.empty{text-align:center;padding:60px 20px;color:var(--faint)}
/* 區塊小標（網站資訊分頁） */
.secttl{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--gold-dk);margin-bottom:14px}
.secttl span{font-weight:400;color:var(--faint);letter-spacing:0;margin-left:6px}
/* 排序鈕 */
.btn.mv{padding:6px 9px;line-height:1;min-width:30px}
.btn.mv[disabled]{opacity:.3;cursor:default}
/* 圖片路徑輸入 */
.pathin{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--ink);min-width:260px}
.pathin:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,87,.13)}
/* 類別複選 */
.cats{display:flex;flex-wrap:wrap;gap:8px}
.catchk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
  padding:9px 14px;font-size:13.5px;color:var(--ink);cursor:pointer;transition:.2s;background:#fff}
.catchk:hover{border-color:var(--gold-lt)}
.catchk.on{border-color:var(--gold);background:rgba(176,141,87,.08);font-weight:600}
.catchk input{width:15px;height:15px;accent-color:var(--gold);cursor:pointer;margin:0}
/* 相簿 */
.gal{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;align-items:center}
.gal .g{width:70px;height:70px;border-radius:8px;border:1px solid var(--line);
  background:#f6f6f6 center/cover no-repeat;position:relative;cursor:pointer;transition:.2s}
.gal .g:hover{border-color:var(--danger);transform:translateY(-2px)}
.gal .g{cursor:grab}
.gal .g:active{cursor:grabbing}
.gal .g.dragging{opacity:.4;transform:scale(.94)}
.gal .g .del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
  background:var(--danger);color:#fff;font-size:13px;line-height:20px;text-align:center;opacity:0;transition:.2s;z-index:2}
.gal .g:hover .del{opacity:1}
/* hover 時提示「設為封面」 */
.gal .g::after{content:"設為封面";position:absolute;left:0;right:0;bottom:0;padding:3px 0;
  background:rgba(20,22,28,.72);color:#fff;font-size:10.5px;text-align:center;
  opacity:0;transition:.2s;border-radius:0 0 7px 7px}
.gal .g:hover::after{opacity:1}
/* 封面區作為拖放目標 */
.preview.dropok{outline:2px dashed var(--gold);outline-offset:3px;background-color:#fdf7ee}
.galempty{color:var(--faint);font-size:13px}
.galtag{display:inline-block;background:var(--line2);color:var(--muted);border-radius:20px;
  padding:1px 8px;font-size:11px;margin-left:4px}
/* 合作建商列 */
.cl-rows{display:flex;flex-direction:column;gap:8px}
.cl-row{display:flex;align-items:center;gap:10px}
.cl-row .no{width:30px;text-align:right;color:var(--faint);font-size:12.5px;flex:0 0 auto}
.cl-row input{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-size:14px;
  color:var(--ink);font-family:inherit;transition:.2s}
.cl-row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,141,87,.13)}
.cl-row .rowact{display:flex;gap:6px;flex:0 0 auto}
/* ---- 數據統計 ---- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh)}
.kpi .lb{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpi .vv{font-size:28px;font-weight:800;color:var(--ink);margin-top:6px;line-height:1.1}
.kpi .vv small{font-size:14px;font-weight:600;color:var(--faint);margin-left:3px}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stgrid .panel{padding:20px 22px}
.stgrid h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--ink);letter-spacing:.03em}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr 46px;align-items:center;gap:10px;font-size:13px}
.bar .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{background:var(--line2);border-radius:20px;height:9px;overflow:hidden}
.bar .fl{height:100%;background:linear-gradient(90deg,var(--gold-lt),var(--gold));border-radius:20px}
.bar .vl{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:4px}
.spark .d{flex:1;background:linear-gradient(180deg,var(--gold-lt),var(--gold));border-radius:3px 3px 0 0;min-height:2px;position:relative}
.spark .d:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:var(--nav);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;margin-bottom:5px;z-index:5}
.sthead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sthead select{border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-family:inherit;font-size:13.5px;color:var(--ink)}
.stnote{color:var(--faint);font-size:12.5px;margin-top:14px;line-height:1.7}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.stgrid{grid-template-columns:1fr}}
/* ---- 新手指引 ---- */
.helpbtn{border:1px solid var(--gold);background:rgba(176,141,87,.1);color:var(--gold-dk);
  padding:9px 14px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:7px;transition:.2s}
.helpbtn:hover{background:var(--gold);color:#fff}
.helpbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
#tourMask{position:fixed;inset:0;z-index:900;display:none}
#tourMask.on{display:block}
/* 四塊遮罩圍出「挖空」的高亮區，中間不擋點擊 */
#tourMask .sh{position:fixed;background:rgba(14,16,22,.62);transition:all .28s cubic-bezier(.22,.61,.36,1)}
#tourRing{position:fixed;border:2px solid var(--gold);border-radius:12px;box-shadow:0 0 0 4px rgba(176,141,87,.28);
  pointer-events:none;transition:all .28s cubic-bezier(.22,.61,.36,1);z-index:902}
#tourPop{position:fixed;z-index:903;width:340px;max-width:calc(100vw - 32px);background:#fff;border-radius:14px;
  box-shadow:0 24px 60px -12px rgba(15,18,28,.4);padding:20px 22px;transition:all .28s cubic-bezier(.22,.61,.36,1)}
#tourPop .step{font-size:11.5px;letter-spacing:.14em;color:var(--gold-dk);font-weight:700;margin-bottom:8px}
#tourPop h4{font-size:16.5px;margin-bottom:8px;color:var(--ink)}
#tourPop p{font-size:13.5px;color:var(--muted);line-height:1.75}
#tourPop .tip{margin-top:10px;background:#fdf9f2;border-left:3px solid var(--gold-lt);
  padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink);line-height:1.7}
#tourPop .row{display:flex;align-items:center;gap:8px;margin-top:16px}
#tourPop .dots{display:flex;gap:5px;margin-right:auto}
#tourPop .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:.2s}
#tourPop .dots i.on{background:var(--gold);width:18px;border-radius:20px}
#tourPop .skip{background:none;border:none;color:var(--faint);font-size:12.5px;cursor:pointer;
  text-decoration:underline;font-family:inherit;padding:4px;white-space:nowrap;flex:0 0 auto}
#tourPop .row .btn{white-space:nowrap;flex:0 0 auto}
.empty svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.4;margin-bottom:12px;opacity:.6}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}
  .side .brand{width:100%;padding:16px 20px}
  .navlist{display:flex;gap:6px;padding:10px;flex:1;overflow-x:auto}
  .navlist button{width:auto;margin:0;white-space:nowrap}
  .side .foot{display:none}
  .topbar{flex-wrap:wrap}
  .topbar h1{width:100%;margin-bottom:6px}
  .form-grid{grid-template-columns:1fr}
  .content{padding:18px}
}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="side">
    <div class="brand">
      <b>煌盛興業</b><span>EGRRA</span>
      <small>網站內容管理後台</small>
    </div>
    <nav class="navlist" id="nav">
      <button data-tab="info" class="on"><span class="i"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v16"/></svg></span>網站資訊</button>
      <button data-tab="products"><span class="i"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>產品花色 <span class="cnt" id="cnt-p">0</span></button>
      <button data-tab="cases"><span class="i"><svg viewBox="0 0 24 24"><path d="M3 7h18v13H3z"/><path d="M8 7V4h8v3"/></svg></span>實績案例 <span class="cnt" id="cnt-c">0</span></button>
      <button data-tab="clients"><span class="i"><svg viewBox="0 0 24 24"><path d="M3 21V9l6-4 6 4v12"/><path d="M15 21V13h6v8"/><path d="M7 12h2M7 16h2"/></svg></span>合作建商 <span class="cnt" id="cnt-cl">0</span></button>
      <button data-tab="news"><span class="i"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg></span>產業快訊 <span class="cnt" id="cnt-n">0</span></button>
      <button data-tab="stats"><span class="i"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><rect x="5" y="11" width="3.5" height="7"/><rect x="10.5" y="6" width="3.5" height="12"/><rect x="16" y="14" width="3.5" height="4"/></svg></span>數據統計</button>
    </nav>
    <div class="foot">
      改完按「<b>發布上線</b>」<br>約 1 分鐘後全站生效<br>
      <a href="/" target="_blank" rel="noopener">↗ 開啟官網</a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <h1 id="ptitle">網站資訊</h1>
      <div class="savestate" id="savestate"><span class="dot"></span><span id="savetext">已儲存</span></div>
      <button class="helpbtn" id="btn-help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3 2.5v1.5"/><path d="M12 17h.01"/></svg>新手指引</button>
      <button class="btn" id="btn-preview"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>預覽官網</button>
      <button class="btn" id="btn-import"><svg viewBox="0 0 24 24"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>匯入備份</button>
      <button class="btn" id="btn-export"><svg viewBox="0 0 24 24"><path d="M12 16V3M7 8l5-5 5 5M5 21h14"/></svg>匯出備份</button>
      <button class="btn" id="btn-save"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7"/></svg>暫存(本機)</button>

/* ============ 材質縮圖產生器（與官網相同）============ */
function stoneSVG(o){
  var w=240,h=200,f=o.freq||"0.012 0.03",oct=Math.min(o.oct||3,4),seed=o.seed||8;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
    '<defs><filter id="v"><feTurbulence type="fractalNoise" baseFrequency="'+f+'" numOctaves="'+oct+'" seed="'+seed+'"/>'+
    '<feColorMatrix type="saturate" values="0"/></filter></defs>'+
    '<rect width="100%" height="100%" fill="'+o.base+'"/>'+
    '<rect width="100%" height="100%" fill="'+o.mid+'" opacity="'+(o.midOp||.5)+'"/>'+
    '<rect width="100%" height="100%" filter="url(#v)" fill="'+o.vein+'" opacity="'+(o.veinOp||.55)+'" style="mix-blend-mode:'+(o.blend||"soft-light")+'"/></svg>';
  return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}

  purple:{base:"#241f27",mid:"#312838",vein:"#6b5a72",freq:"0.012 0.03",veinOp:.5,blend:"screen",seed:7},
  darkgrey:{base:"#454440",mid:"#4a4741",vein:"#8c887f",freq:"0.01 0.03",veinOp:.5,seed:20},

/* 系列 / 類別選項一律從「現有資料實際使用的值」動態產生，
   避免寫死的清單與網站脫節（舊版寫死時，編輯既有項目會因下拉找不到對應值
   而自動跳到第一項，一存檔就把分類改壞）。 */
function optsFrom(arr,key,fallback){
  var seen={},out=[];
  (arr||[]).forEach(function(x){
    var v=x&&x[key];
    if(v&&!seen[v]){seen[v]=1;out.push(v);}
  });
  (fallback||[]).forEach(function(v){if(!seen[v]){seen[v]=1;out.push(v);}});
  return out;
}
function seriesOpts(){return optsFrom(DATA.products,"series",["石紋系列","鏽蝕系列","木紋系列"]);}
/* 一個案場可同時屬於多個類別（例如同時做防火門與消防箱）。
   新資料存 cats 陣列；舊資料只有單一 category，讀取時一併相容。 */
function catsOf(c){
  if(c&&Array.isArray(c.cats)&&c.cats.length)return c.cats.slice();

}

}

  var prev=catsOf(DATA.cases.find(function(x){return x.id===editing.id;})||{});

/* ============ 狀態 ============ */
var LS_KEY="egrra_data";
function clone(o){return JSON.parse(JSON.stringify(o));}
function loadData(){
  var d=null,stale=false;
  try{var s=localStorage.getItem(LS_KEY);if(s){var p=JSON.parse(s);if(p&&p.products)d=p;}}catch(e){}
  if(d){
    /* 程式端內容若比本機草稿新（例如整批重建了實績案例），草稿就是過期的，
       直接沿用會讓後台顯示舊資料、且一發布就把新內容蓋回去。
       版本較舊時改用程式端資料，並保留草稿備份供必要時取回。 */
    var dv=String(d.dataVersion||""), sv=String((window.EGRRA_DEFAULT_DATA||{}).dataVersion||"");
    if(sv&&(!dv||dv<sv)){
      try{localStorage.setItem(LS_KEY+"_backup",JSON.stringify(d));}catch(e){}
      d=null;stale=true;
    }
  }
  if(!d)d=clone(window.EGRRA_DEFAULT_DATA);
  else synced=syncSections(d);
  if(stale)setTimeout(function(){
    toast("已載入網站最新內容（本機舊草稿已過期，另存為備份）","ok");
  },600);
  return normalize(d);
}

/* ---- 分區同步 ----
   程式端（site-data.js）若整批新增了實績案例或產品花色，草稿裡不會有這些內容；
   而整份丟掉草稿又會連帶弄丟使用者其他還沒發布的修改。
   因此改成逐區判斷：sectionVersions 宣告「這一區是程式端何時更新的」，
   比草稿新就只換掉那一區。換完把草稿版本推上去，避免下次載入又蓋掉使用者的編輯。 */
var synced=[];
function syncSections(d){
  var def=window.EGRRA_DEFAULT_DATA||{}, sv=def.sectionVersions||{};
  var done=[], newest=String(d.dataVersion||"");
  Object.keys(sv).forEach(function(k){
    var v=String(sv[k]||"");
    if(!v||def[k]===undefined)return;
    if(v>String(d.dataVersion||"")){
      var before=Array.isArray(d[k])?d[k].length:0;
      d[k]=clone(def[k]);
      done.push({sec:k, before:before, after:Array.isArray(d[k])?d[k].length:0});
      if(v>newest)newest=v;
    }
  });
  if(done.length){
    /* 同步過就把版本推上去；否則每次開後台都會再蓋一次，使用者改的會被還原 */
    d.dataVersion=newest;
    try{localStorage.setItem(LS_KEY,JSON.stringify(d));}catch(e){}
  }
  return done;
}
var SEC_LABEL={products:"產品花色",cases:"實績案例",clients:"合作建商",info:"網站資訊",compare:"競品比較"};
/* 補齊缺漏結構。
   重點：本機草稿可能是「某個區段還不存在時」存下來的（例如 clients 是後來才加的），
   此時必須用程式端預設值補回，不能給空陣列 —— 否則使用者開後台會看到整個區段空白，
   誤以為資料遺失。info 內後來新增的欄位（fbName / tiktok…）同理。 */
function normalize(d){
  var def=window.EGRRA_DEFAULT_DATA||{};
  if(!d.info||typeof d.info!=="object")d.info={};
  ["products","cases","clients"].forEach(function(k){
    if(!Array.isArray(d[k]))d[k]=clone(def[k]||[]);
  });
  Object.keys(def.info||{}).forEach(function(k){
    if(d.info[k]===undefined)d.info[k]=def.info[k];
  });
  d.clients.forEach(function(c,i){ if(!c.id)c.id="cl"+i+"_"+(c.name||"").slice(0,6); });
  d.products.forEach(function(p,i){ if(!p.id)p.id="p"+i; });
  d.cases.forEach(function(c,i){ if(!c.id)c.id="c"+i; });
  return d;
}

/* 有同步進來的區塊就告知，否則使用者不會知道後台內容被更新過 */
if(synced.length)setTimeout(function(){

/* ============ 圖片處理（上傳自動壓縮 → 傳雲端，只留網址）============
   照片若以 base64 內嵌，一張 1400px JPEG 約 300KB、轉成文字後膨脹到 400KB，
   而 localStorage 只有約 5MB、/api/save 只吃約 4.5MB，十來張就爆。
   因此壓縮後一律先傳到 Blob，資料裡只存一段網址（約 90 字）。
   若雲端不可用（例如用 file:// 開本機檔），退回 base64 以免功能整個壞掉。 */

var PW_KEY="egrra_pw";
function getPw(){
  var pw=sessionStorage.getItem(PW_KEY)||"";
  if(!pw){
    pw=prompt("請輸入發布密碼（在 Vercel 設定的 ADMIN_PASSWORD）：")||"";
    if(pw)sessionStorage.setItem(PW_KEY,pw);
  }
  return pw;
}
var cloudOff=false; /* 這次工作階段已確認雲端不可用，就不再逐張重試 */
function uploadToCloud(dataUrl,name,cb){
  if(cloudOff||location.protocol==="file:"||dataUrl.slice(0,5)!=="data:"){cb(null);return;}
  var pw=getPw();
  if(!pw){cloudOff=true;cb(null);return;}
  fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:pw,dataUrl:dataUrl,name:name})})
    .then(function(r){return r.text().then(function(t){var j=null;try{j=JSON.parse(t);}catch(e){}return{status:r.status,j:j};});})
    .then(function(res){
      if(res.j&&res.j.ok&&res.j.url){cb(res.j.url);return;}
      if(res.j&&res.j.error==="bad_password"){sessionStorage.removeItem(PW_KEY);toast("密碼錯誤，這張暫存在本機","err");}
      else{cloudOff=true;toast("雲端上傳失敗，照片暫存本機（容量有限）","err");}
      cb(null);
    })
    .catch(function(){cloudOff=true;cb(null);});
}
/* 移除照片時把雲端檔案一併刪掉，避免留下沒人用的孤兒檔 */
function deleteFromCloud(urls){
  urls=(urls||[]).filter(function(u){return typeof u==="string"&&u.indexOf("/uploads/")>0;});
  if(!urls.length||cloudOff||location.protocol==="file:")return;
  var pw=sessionStorage.getItem(PW_KEY)||"";
  if(!pw)return;
  fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:pw,action:"del",urls:urls})}).catch(function(){});
}
function processImage(file,cb){
  if(!file){cb("");return;}
  if(!/^image\//.test(file.type)){toast("請選擇圖片檔","err");return;}
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1600,w=img.width,h=img.height;
      if(w>max||h>max){var r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      var c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      var data=c.toDataURL("image/jpeg",0.85);
      uploadToCloud(data,file.name,function(url){cb(url||data);});
    };
    img.onerror=function(){toast("圖片讀取失敗","err");};
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function selField(id,label,opts,cur){

     否則瀏覽器會自動顯示第一個選項，使用者一存檔就把原值改掉（無聲的資料毀損）。 */
  var vals=opts.map(function(x){return Array.isArray(x)?x[0]:x;});
  if(cur&&vals.indexOf(cur)<0)opts=opts.concat([cur]);
  var o=opts.map(function(x){var v=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;
    return '<option value="'+esc(v)+'"'+(v===cur?" selected":"")+'>'+esc(t)+'</option>';}).join("");
  return '<div class="f"><label>'+label+'</label><select id="'+id+'">'+o+'</select></div>';
}

/* ---- 相簿編輯 ---- */
function bindGallery(){
  var host=document.getElementById("e-gal");
  if(!host)return;
  var prev=document.getElementById("e-prev");
  var pathIn=document.getElementById("e-imgpath");

  /* 封面永遠是 draftImgs[0]；換封面＝把該張與第 0 張對調，原封面自動回到相簿 */
  function setCover(idx){
    ensureCover();
    var g=editing.draftImgs;
    if(idx<=0||idx>=g.length)return;
    var t=g[0]; g[0]=g[idx]; g[idx]=t;
    editing.draftImg=g[0];
    if(prev){prev.style.backgroundImage="url('"+g[0]+"')";prev.innerHTML="";}
    if(pathIn)pathIn.value=(g[0]&&g[0].indexOf("data:")!==0)?g[0]:"";
    redraw();
    toast("已設為封面，原封面移回相簿","ok");
  }
  function removeAt(idx){
    ensureCover();
    var gone=editing.draftImgs.splice(idx,1)[0];
    /* 只有這次編輯真的丟掉、且沒被其他地方引用的雲端檔才刪 */
    if(gone&&editing.draftImgs.indexOf(gone)<0)pendingDelete.push(gone);
    redraw();
  }
  function redraw(){
    var extra=(editing.draftImgs||[]).slice(1);
    host.innerHTML=extra.length?extra.map(function(s,i){
      return '<div class="g" draggable="true" data-gi="'+(i+1)+'" style="background-image:url(\''+esc(s)+'\')" '+
             'title="點一下設為封面；拖到左上封面也可以"><span class="del" title="刪除這張">×</span></div>';
    }).join(""):'<div class="galempty">尚無其他照片</div>';
    host.querySelectorAll("[data-gi]").forEach(function(g){
      var idx=parseInt(g.dataset.gi,10);
      g.addEventListener("click",function(e){
        if(e.target.classList.contains("del")){ e.stopPropagation(); removeAt(idx); return; }
        setCover(idx);
      });
      g.addEventListener("dragstart",function(e){
        e.dataTransfer.setData("text/plain",String(idx));
        e.dataTransfer.effectAllowed="move";
        g.classList.add("dragging");
      });
      g.addEventListener("dragend",function(){ g.classList.remove("dragging"); });
    });
  }
  /* 封面區當作放置目標：把相簿照片拖過來即替換 */
  if(prev&&!prev.dataset.dropBound){
    prev.dataset.dropBound="1";
    prev.addEventListener("dragover",function(e){ e.preventDefault(); prev.classList.add("dropok"); });
    prev.addEventListener("dragleave",function(){ prev.classList.remove("dropok"); });
    prev.addEventListener("drop",function(e){
      e.preventDefault(); prev.classList.remove("dropok");
      var idx=parseInt(e.dataTransfer.getData("text/plain"),10);
      if(!isNaN(idx))setCover(idx);
    });
  }
  function ensureCover(){
    /* imgs[0] 依約定為封面；若尚無資料先放目前封面佔位 */
    if(!editing.draftImgs)editing.draftImgs=[];
    if(!editing.draftImgs.length){
      var cur=editing.draftImg;
      if(cur===undefined){
        var it=DATA.cases.find(function(x){return x.id===editing.id;});
        cur=it&&it.img||"";
      }
      editing.draftImgs=[cur||""];
    }
  }
  redraw();
  var f=document.getElementById("e-galfile");
  if(f)f.addEventListener("change",function(){
    var files=[].slice.call(f.files);if(!files.length)return;
    var left=files.length;
    files.forEach(function(file){
      processImage(file,function(data){
        ensureCover();editing.draftImgs.push(data);
        if(--left===0){redraw();toast("已加入 "+files.length+" 張（記得按儲存）","ok");}
      });
    });
    f.value="";
  });
  var p=document.getElementById("e-galpath");
  if(p)p.addEventListener("keydown",function(e){
    if(e.key!=="Enter")return;
    e.preventDefault();
    var v=p.value.trim();if(!v)return;
    ensureCover();editing.draftImgs.push(v);p.value="";redraw();
  });
}

document.getElementById("msave").onclick=function(){
  var type=editing.type;var val=function(id){var el=document.getElementById(id);return el?el.value.trim():"";};
  var obj;
  if(type==="products"){
    if(!val("e-name")){toast("請輸入花色名稱","err");return;}
    obj={name:val("e-name"),series:val("e-series"),stone:val("e-stone"),sizes:val("e-sizes"),finish:val("e-finish"),desc:val("e-desc")};
  }else{
    if(!val("e-region")&&!val("e-title")){toast("請至少輸入地區或案名","err");return;}
    var cs=readCats();
    if(!cs.length){toast("請至少勾選一個類別","err");return;}
    /* category 保留為主類別(第一個)，供只讀單值的舊程式沿用 */
    obj={region:val("e-region"),title:val("e-title"),category:cs[0],cats:cs,
         stone:val("e-stone"),year:val("e-year")};
  }
  if(editing.id){
    var it=DATA[type].find(function(x){return x.id===editing.id;});
    for(var kk in obj)it[kk]=obj[kk];
    if(editing.draftImg!==undefined)it.img=editing.draftImg;
    if(type==="cases")applyGallery(it);
  }else{
    obj.id=(type==="products"?"p":"c")+Date.now();
    obj.img=editing.draftImg||"";
    if(type==="cases")applyGallery(obj);
    DATA[type].push(obj);
  }
  setDirty(true);var ok=saveData(true);
  /* 儲存後才清雲端孤兒；同一張可能被別的案例引用，先掃過全部資料再刪 */
  if(pendingDelete.length){
    var inUse=JSON.stringify(DATA);
    deleteFromCloud(pendingDelete.filter(function(u){return inUse.indexOf(u)<0;}));
    pendingDelete=[];
  }
  closeModal();render();
  if(ok)toast(editing.id?"已更新":"已新增","ok");
};

function bars(list,labelMap){
  if(!list||!list.length)return '<div class="stnote">此區間尚無資料</div>';
  var max=list[0].count||1;
  return '<div class="bars">'+list.map(function(x){
    var nm=(labelMap&&labelMap[x.name])||x.name;
    return '<div class="bar"><span class="nm" title="'+esc(nm)+'">'+esc(nm)+'</span>'+
      '<span class="tr"><span class="fl" style="width:'+Math.max(3,Math.round(x.count/max*100))+'%"></span></span>'+
      '<span class="vl">'+x.count+'</span></div>';
  }).join("")+'</div>';
}

function loadTopics(){
  var pw=newsPw(); if(!pw)return;
  fetch("/api/news?config=1&key="+encodeURIComponent(pw))
    .then(function(r){return r.json();})
    .then(function(d){ if(d&&d.topics){ NEWS.topics=d.topics; renderNews(); } })
    .catch(function(){});
}
function loadNews(){
  var pw=newsPw(); if(!pw){ pw=getPw(); if(!pw)return; }
  fetch("/api/news?all=1&key="+encodeURIComponent(pw))
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.error){ toast(d.error==="bad_password"?"密碼錯誤":"讀取失敗："+d.error,"err");
        sessionStorage.removeItem(PW_KEY); NEWS.loaded=true; renderNews(); return; }
      NEWS.items=(d&&d.items)||[]; NEWS.updated=(d&&d.updated)||""; NEWS.loaded=true;
      var n=NEWS.items.filter(function(x){return x.status==="pending";}).length;
      var el=document.getElementById("cnt-n"); if(el)el.textContent=n;
      renderNews();
    })
    .catch(function(){ NEWS.loaded=true; renderNews(); toast("連不到後端","err"); });
}
/* 本地先更新，畫面立刻反應；伺服器同步是背景的事。
   先前每按一次都要等「POST 存檔 → 整份重新讀取」兩趟往返，
   加上 Blob 寫入延遲，刪一則要好幾秒，刪十則就等半分鐘。 */
var NEWS_SNAP=null;
function snap(){ NEWS_SNAP=JSON.parse(JSON.stringify(NEWS.items)); }
function revert(msg){
  if(NEWS_SNAP){ NEWS.items=NEWS_SNAP; NEWS_SNAP=null; renderNews(); }
  if(msg)toast(msg,"err");
}
function removeLocal(ids){
  snap();
  var set={}; ids.forEach(function(i){set[i]=1;});
  NEWS.items=NEWS.items.filter(function(x){return !set[x.id];});
  renderNews();
}
function setStatus(ids,st,ed){
  snap();
  var set={}; ids.forEach(function(i){set[i]=1;});
  NEWS.items.forEach(function(x){
    if(!set[x.id])return;
    x.status=st;
    if(st==="published")x.publishedAt=new Date().toISOString();
    if(ed){ if(ed.title!==undefined)x.title=ed.title; if(ed.body!==undefined)x.body=ed.body; }
  });
  renderNews();
}
/* 失敗一定要說原因 —— 先前沒有 else，錯誤時畫面完全沒反應 */
function newsAct(action,ids,extra){
  var pw=getPw();
  if(!pw){ toast("需要發布密碼才能操作","err"); return Promise.resolve(null); }
  if(!Array.isArray(ids))ids=[ids];
  var body={password:pw,action:action,ids:ids};
  if(extra)for(var k in extra)body[k]=extra[k];
  return fetch("/api/news",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)})
    .then(function(r){return r.text().then(function(t){
        var j=null; try{j=JSON.parse(t);}catch(e){}
        return {status:r.status,ok:r.ok,j:j,raw:t};
      });})
    .then(function(res){
      if(res.ok&&res.j&&res.j.ok){
        if(!res.j.changed)toast("沒有任何項目被變更（可能已被其他分頁改過，請按重新載入）","err");
        return res.j;
      }
      if(res.j&&res.j.error==="bad_password"){
        sessionStorage.removeItem(PW_KEY);
        revert("發布密碼錯誤，請再操作一次並重新輸入");
      }else{
        revert("操作失敗："+((res.j&&(res.j.detail||res.j.error))||("HTTP "+res.status)));
      }
      return null;
    })
    .catch(function(err){ revert("連不到後端："+(err&&err.message||"")); return null; });
}
content.addEventListener("click",function(e){
  /* 只在產業快訊分頁作用 —— data-del 等屬性在案例／花色頁也有，不隔開會誤觸 */
  if(tab!=="news")return;
  var t=e.target.closest("[data-f]");
  if(t&&t.closest("#nw-f")){ NEWS.filter=t.dataset.f; renderNews(); return; }
  if(e.target.closest("#nw-reload")){ NEWS.loaded=false; renderNews(); return; }
  if(e.target.closest("#nw-topics-toggle")){
    NEWS.showTopics=!NEWS.showTopics;
    if(NEWS.showTopics&&!NEWS.topics.length)loadTopics();
    renderNews(); return;
  }
  if(e.target.closest("#nw-topics-add")){
    var k=prompt("新主題的名稱（例如：都市更新）"); if(!k)return;
    var q=prompt("關鍵字，用、分隔（例如：都更 補助、危老 重建）"); if(!q)return;
    NEWS.topics.push({key:k.trim(),on:true,qs:q.split(/[、,，]/).map(function(x){return x.trim();}).filter(Boolean)});
    renderNews(); return;
  }
  if(e.target.closest("#nw-topics-save")){
    var pw=getPw(); if(!pw)return;
    var out=NEWS.topics.map(function(t,i){
      var cb=content.querySelector('[data-ton="'+i+'"]');
      var qi=content.querySelector('[data-tqs="'+i+'"]');
      return { key:t.key, on:cb?cb.checked:true,
               qs:(qi?qi.value:"").split(/[、,，]/).map(function(x){return x.trim();}).filter(Boolean) };
    }).filter(function(t){return t.qs.length;});
    if(!out.length){ toast("至少要留一個主題，而且要有關鍵字","err"); return; }
    fetch("/api/news",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:pw,action:"topics",topics:out})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok){ NEWS.topics=out; toast("已儲存 "+d.changed+" 個主題","ok"); renderNews(); }
        else toast("儲存失敗："+((d&&(d.detail||d.error))||"未知"),"err");
      }).catch(function(){ toast("連不到後端","err"); });
    return;
  }
  if(e.target.closest("#nw-fetch")){
    var pw=getPw(); if(!pw)return;
    var b=e.target.closest("#nw-fetch"); b.disabled=true; b.textContent="抓取中…";
    fetch("/api/news-fetch?key="+encodeURIComponent(pw))
      .then(function(r){return r.json();}).then(function(d){
        b.disabled=false; b.textContent="抓取一則";
        if(d&&d.ok){ toast("新增 "+d.kept+" 則待審（共掃描 "+d.fetched+" 則）","ok");
          NEWS.loaded=false; renderNews(); }
        else toast("抓取失敗："+((d&&(d.detail||d.error))||"未知"),"err");
      }).catch(function(){ b.disabled=false; b.textContent="抓取一則"; toast("連不到後端","err"); });
    return;
  }
  function nwEdits(id){
    var t=content.querySelector('[data-nwtitle="'+id+'"]');
    var b=content.querySelector('[data-nwbody="'+id+'"]');
    return { title:t?t.value:undefined, body:b?b.value:undefined };
  }
  var sv=e.target.closest("[data-nwsave]");
  if(sv){
    newsAct("update",sv.dataset.nwsave,nwEdits(sv.dataset.nwsave)).then(function(d){
      if(d&&d.ok){ toast("已儲存","ok"); NEWS.loaded=false; renderNews(); }});
    return;
  }
  var pub=e.target.closest("[data-pub]");
  if(pub){
    var id=pub.dataset.pub, ed=nwEdits(id);
    if(!ed.body||!ed.body.trim()){ toast("內文是空的，請先寫好再發布","err"); return; }
    setStatus([id],"published",ed);
    /* 內容與狀態一次送出 —— 分兩次會有寫入競態，後一次可能蓋掉前一次 */
    newsAct("save",id,{title:ed.title,body:ed.body,status:"published"})
      .then(function(d){ if(d&&d.ok)toast("已發布到官網","ok"); });
    return;
  }
  var rej=e.target.closest("[data-rej]");
  if(rej){
    var wasPub=rej.textContent.indexOf("下架")>=0;
    setStatus([rej.dataset.rej],"rejected");
    newsAct("reject",rej.dataset.rej).then(function(d){
      if(d&&d.ok)toast(wasPub?"已從官網下架":"已略過（不會再抓回來）","ok"); });
    return;
  }
  var del=e.target.closest("[data-nwdel]");
  if(del){
    removeLocal([del.dataset.nwdel]);
    newsAct("delete",del.dataset.nwdel).then(function(d){
      if(d&&d.ok)toast("已刪除","ok"); });
    return;
  }
  /* ---- 批次處理：一則一則按太慢 ---- */
  var bulk=e.target.closest("[data-bulk]");
  if(bulk){
    var sel=[].slice.call(content.querySelectorAll("[data-nwsel]:checked"))
      .map(function(c){return c.dataset.nwsel;});
    if(!sel.length){ toast("請先勾選要處理的項目","err"); return; }
    var act=bulk.dataset.bulk;
    if(act==="delete"&&!confirm("確定刪除勾選的 "+sel.length+" 則？"))return;
    if(act==="delete")removeLocal(sel); else setStatus(sel,act==="publish"?"published":"rejected");
    var call=act==="delete"?newsAct("delete",sel)
            :newsAct("save",sel,{status:act==="publish"?"published":"rejected"});
    call.then(function(d){
      if(d&&d.ok)toast((act==="delete"?"已刪除 ":act==="publish"?"已發布 ":"已略過 ")+sel.length+" 則","ok"); });
    return;
  }
  var all=e.target.closest("#nw-selall");
  if(all){
    var on=all.dataset.on!=="1"; all.dataset.on=on?"1":"0";
    [].forEach.call(content.querySelectorAll("[data-nwsel]"),function(c){c.checked=on;});
    all.textContent=on?"取消全選":"全選";
    return;
  }
});

/* ---- 儲存空間狀態：把「還有多少可用」講清楚，並提供一鍵搬到雲端 ----
   JSON.stringify(DATA) 在照片存本機時可能是好幾 MB，不能每次重繪都算。
   資料沒變就沿用上次結果（以 setDirty/儲存為準清掉快取）。 */
var _sizeCache=null;
function invalidateSize(){_sizeCache=null;}
function sizeInfo(){
  if(_sizeCache)return _sizeCache;
  var s=JSON.stringify(DATA),n=0,bytes=0;
  s.replace(/"data:image\/[^"]+"/g,function(m){n++;bytes+=m.length;return m;});
  _sizeCache={n:n,bytes:bytes,total:s.length};
  return _sizeCache;
}
function localPhotos(){return sizeInfo();}
function storageBox(){
  var p=sizeInfo(), total=p.total;
  var pct=Math.min(100,Math.round(total/5000000*100));
  var warn=p.n>0;
  return '<div class="notice" style="'+(warn?'border-color:#c98a2e':'')+'">'+
    '<svg viewBox="0 0 24 24"><path d="M3 7h18v13H3z"/><path d="M8 7V4h8v3"/></svg><div>'+
    '<b>照片儲存空間</b>'+
    '<div style="margin:6px 0;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden">'+
      '<div style="height:100%;width:'+pct+'%;background:'+(pct>75?'#d9534f':pct>45?'#c98a2e':'#5aa469')+'"></div></div>'+
    '<div style="font-size:12.5px;color:var(--faint)">本機資料 '+Math.round(total/1024)+' KB／上限約 5,000 KB（'+pct+'%）'+
      (warn?'，其中 <b>'+p.n+' 張照片</b>存在本機佔了 '+Math.round(p.bytes/1024)+' KB':'') +'</div>'+
    (warn
      ? '<div style="margin-top:8px;font-size:12.5px">存在本機的照片會擠爆瀏覽器容量，也會讓「發布上線」超過 4.5MB 上限。'+
        '搬到雲端後資料裡只留一段網址，容量上限就不再是問題，官網圖片也改由 CDN 直送。'+
        '<div style="margin-top:8px"><button class="btn gold sm" id="btn-migrate">把 '+p.n+' 張照片搬到雲端</button>'+
        '<span id="migrate-log" style="margin-left:10px;color:var(--faint)"></span></div></div>'
      : '<div style="margin-top:8px;font-size:12.5px;color:var(--faint)">目前照片都存在雲端，沒有容量問題 ✓</div>')+
    '</div></div>';
}
/* 逐張把 base64 照片上傳到 Blob，成功就地換成網址；一張一張來，避免一次打爆後端 */
function migratePhotos(){
  var pw=getPw(); if(!pw)return;
  cloudOff=false;
  var btn=document.getElementById("btn-migrate"), log=document.getElementById("migrate-log");
  var seen=[];
  JSON.stringify(DATA).replace(/"(data:image\/[^"]+)"/g,function(m,d){if(seen.indexOf(d)<0)seen.push(d);return m;});
  if(!seen.length){toast("沒有需要搬移的照片","ok");return;}
  if(btn){btn.disabled=true;btn.textContent="搬移中…";}
  var i=0,okCount=0,map={};
  (function next(){
    if(i>=seen.length){
      /* 全部跑完才一次改寫資料，中途失敗也不會留下半套 */
      var s=JSON.stringify(DATA);
      Object.keys(map).forEach(function(d){ s=s.split(JSON.stringify(d)).join(JSON.stringify(map[d])); });
      DATA=JSON.parse(s);
      setDirty(true); saveData(true); render();
      toast(okCount+" 張已搬到雲端"+(okCount<seen.length?"（"+(seen.length-okCount)+" 張失敗，可再按一次）":"，記得按「發布上線」"),okCount?"ok":"err");
      return;
    }
    if(log)log.textContent=(i+1)+" / "+seen.length;
    uploadToCloud(seen[i],"case-photo",function(url){
      if(url){map[seen[i]]=url;okCount++;}
      i++; next();
    });
  })();
}

    tab=t.tab;search="";
    document.querySelectorAll("#nav button").forEach(function(x){x.classList.toggle("on",x.dataset.tab===tab);});
    render();
  }
  /* 等瀏覽器完成分頁重繪與版面計算後再量測，否則會量到切換前的舊座標，
     高亮框會停在上一步的位置。rAF 在背景分頁會被瀏覽器暫停，因此加上
     計時器保險，確保切回來時導覽一定會更新。 */
  afterLayout(function(){ tourPaint(t,i); });
}
function afterLayout(fn){
  var done=false;
  function run(){ if(done)return; done=true; fn(); }
  requestAnimationFrame(function(){ requestAnimationFrame(run); });
  setTimeout(run,120);
}
function tourPaint(t,i){
  var E=tourEls();
  var el=document.querySelector(t.el);
  if(!el){ /* 找不到就跳過該步，避免卡住 */ return tourShow(i+1); }
  /* 用即時捲動而非 smooth：平滑捲動還在動的時候量到的座標是舊的，
     高亮框會定位在錯誤位置。捲完立刻在下一影格量測最準。 */
  try{ el.scrollIntoView({block:"center",behavior:"instant"}); }
  catch(e){ el.scrollIntoView(true); }
  afterLayout(function(){
    var r=el.getBoundingClientRect(), pad=6;
    /* 視窗尺寸取不到時(某些內嵌檢視)退回文件寬高，避免定位全部算成 0 */
    var VW=window.innerWidth||document.documentElement.clientWidth||1280;
    var VH=window.innerHeight||document.documentElement.clientHeight||800;
    var x=r.left-pad, y=r.top-pad, w=r.width+pad*2, h=r.height+pad*2;
    E.mask.classList.add("on");
    /* 四塊遮罩圍出中間的高亮區 */
    var s=function(id,css){var d=document.getElementById(id);for(var k in css)d.style[k]=css[k];};
    s("sh-t",{left:"0px",top:"0px",width:"100%",height:Math.max(0,y)+"px"});
    s("sh-b",{left:"0px",top:(y+h)+"px",width:"100%",height:Math.max(0,VH-(y+h))+"px"});
    s("sh-l",{left:"0px",top:y+"px",width:Math.max(0,x)+"px",height:h+"px"});
    s("sh-r",{left:(x+w)+"px",top:y+"px",width:Math.max(0,VW-(x+w))+"px",height:h+"px"});
    E.ring.style.display="block";
    E.ring.style.left=x+"px";E.ring.style.top=y+"px";
    E.ring.style.width=w+"px";E.ring.style.height=h+"px";
    /* 先填內容再量高度，否則量到的是上一步的尺寸，卡片會被推出畫面 */
    document.getElementById("tourStep").textContent="第 "+(i+1)+" 步 / 共 "+TOUR.length+" 步";
    document.getElementById("tourTitle").textContent=t.title;
    document.getElementById("tourText").textContent=t.text;
    document.getElementById("tourTip").innerHTML=t.tip?'<div class="tip">💡 '+esc(t.tip)+'</div>':"";
    document.getElementById("tourDots").innerHTML=TOUR.map(function(_,k){
      return '<i class="'+(k===i?"on":"")+'"></i>';}).join("");
    document.getElementById("tourPrev").style.visibility=i===0?"hidden":"visible";
    document.getElementById("tourNext").textContent=(i===TOUR.length-1)?"完成":"下一步";
    /* 說明卡：優先放右側，空間不夠改左側，再不夠就上下擺 */
    E.pop.style.display="block";
    var pw=E.pop.offsetWidth||340, ph=E.pop.offsetHeight||220, gap=16, px, py;
    if(x+w+gap+pw<VW-10){ px=x+w+gap; py=y+h/2-ph/2; }
    else if(x-gap-pw>10){ px=x-gap-pw; py=y+h/2-ph/2; }
    else {
      px=x+w/2-pw/2;
      py=(y+h+gap+ph<VH-10)?(y+h+gap):(y-gap-ph);   /* 下方放不下就放上方 */
    }
    px=Math.max(10,Math.min(px,VW-pw-10));
    py=Math.max(10,Math.min(py,VH-ph-10));
    E.pop.style.left=px+"px";E.pop.style.top=py+"px";
  });
}
function tourEnd(){
  var E=tourEls();
  E.mask.classList.remove("on");E.ring.style.display="none";E.pop.style.display="none";
  try{localStorage.setItem("egrra_tour_done","1");}catch(e){}
}
function tourStart(){ tourShow(0); }
document.getElementById("btn-help").addEventListener("click",tourStart);
document.getElementById("tourNext").addEventListener("click",function(){
  if(tourI>=TOUR.length-1){tourEnd();toast("指引完成！隨時可再按「新手指引」重看","ok");}
  else tourShow(tourI+1);
});
document.getElementById("tourPrev").addEventListener("click",function(){if(tourI>0)tourShow(tourI-1);});
document.getElementById("tourSkip").addEventListener("click",tourEnd);
document.addEventListener("keydown",function(e){
  if(document.getElementById("tourMask").classList.contains("on")){
    if(e.key==="Escape")tourEnd();
    else if(e.key==="ArrowRight")document.getElementById("tourNext").click();
    else if(e.key==="ArrowLeft")document.getElementById("tourPrev").click();
  }
});
window.addEventListener("resize",function(){
  if(document.getElementById("tourMask").classList.contains("on"))tourPaint(TOUR[tourI],tourI);
});
/* 第一次進後台自動開啟指引 */
try{ if(localStorage.getItem("egrra_tour_done")!=="1")setTimeout(tourStart,700); }catch(e){}

/* 開過後台＝自己人：標記這台瀏覽器，之後瀏覽官網一律不列入統計 */
try{ localStorage.setItem("egrra_no_track","1"); }catch(e){}

/* 啟動 */
(function(){var h=location.hash;if(h==="#products")tab="products";else if(h==="#cases")tab="cases";
  document.querySelectorAll("#nav button").forEach(function(x){x.classList.toggle("on",x.dataset.tab===tab);});})();
render();setDirty(false);
</script>
</body>
