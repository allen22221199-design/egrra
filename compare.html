    "紋理表現":"Texture","設計與客製":"Design & customisation","耐用與安全":"Durability & safety",
    "成本與總結":"Cost & summary","規格與應用":"Specs & applications","耐用性能":"Durability",

    "其餘項目中，競品有 ":"Competitors are equally strong in ",

    "本身即為真石材":"It is real stone","天然礦脈形成，無可複製":"Formed by natural veining — cannot be replicated",

  };
  function isEn(){ return document.documentElement.getAttribute("data-lang")==="en"; }
  /* 動態字串：先查本頁字典，再交給共用 i18n；都查不到就原樣輸出 */
  function t(s){
    if(isEn() && CMP_EN[s]!=null) return CMP_EN[s];
    return (window.EGRRA_I18N && EGRRA_I18N.t) ? EGRRA_I18N.t(s) : s;
  }
  function tt(s){ return esc(t(s)); }

  var FLAG={win:"優勝",top:"壓倒性優勝",limit:"限制"};
  function flagHtml(f){ return f&&FLAG[f] ? '<span class="flag '+f+'">'+tt(FLAG[f])+'</span>' : ""; }
  /* 純數字＋單位（如 3H / 9H）放大顯示，其餘照常 */
  function bigify(v){
    return /^[0-9]{1,2}H$/.test(v) ? '<em>'+esc(v)+'</em>' : tt(v);
  }
  function cellHtml(c){
    if(!c) return "";
    /* big：資料指定要放大的關鍵數字，獨立一行當賣點；unit 是它後面的小字單位 */
    var big=c.big?'<div class="big">'+tt(c.big)+(c.unit?'<small>'+tt(c.unit)+'</small>':"")+'</div>':"";
    /* dim＝出處與但書。放在該格內的小字，競品數值才追得到來源；
       曾改成表尾編號註解，但表尾會堆成一長串，反而礙眼。 */
    return flagHtml(c.flag)+big+
      '<div class="v">'+bigify(c.v||"")+'</div>'+
      (c.note?'<div class="note">'+tt(c.note)+'</div>':"")+
      (c.dim ?'<div class="dim">'+tt(c.dim)+'</div>':"");
  }
  /* 計分：藝格板在這張表拿下幾項。先給結論，再讓人看細節 */
  function scoreHtml(T){
    var rows=T.rows||[];
    if(!rows.length) return "";
    var win=rows.filter(function(r){return r.us&&(r.us.flag==="win"||r.us.flag==="top");}).length;
    /* 競品也會有勝出的項目，一併講出來。只報自己贏的，懂行的人一看就打折扣 */
    var other=0;
    rows.forEach(function(r){ (r.cells||[]).forEach(function(c){ if(c&&c.flag==="win")other++; }); });
    var pct=Math.round(win/rows.length*100);
    return '<div class="big">'+win+'<small>/ '+rows.length+'</small></div>'+
      '<div class="txt">'+tt("項規格由 ")+'<b>'+tt(T.us&&T.us.name||"")+'</b>'+tt(" 勝出")+
      (other?'<br><span style="color:rgba(255,255,255,.55);font-size:13px">'+
        tt("其餘項目中，競品有 ")+other+tt(" 處表現同樣出色，一併標示於表中")+'</span>':"")+'</div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>';
  }
  function pad(i){ return (i+1)<10 ? "0"+(i+1) : String(i+1); }

  function draw(){
    /* 標題與前言取自資料，中英都走同一個字典，日後改資料即可生效 */
    if(C.title)document.getElementById("cmp-h1").textContent=t(C.title);
    if(C.lead) document.getElementById("cmp-lead").textContent=t(C.lead);

    var T=TABLES[cur];
    if(!T){ elTbl.innerHTML=""; elCards.innerHTML='<p class="cmp-srcs">'+tt("目前沒有可顯示的比較表。")+'</p>'; elSrcs.textContent=""; return; }

    elTabs.innerHTML=TABLES.map(function(x,i){
      return '<button class="cmp-tab'+(i===cur?" on":"")+'" data-i="'+i+'">'+tt(x.name||"")+'</button>';
    }).join("");
    elSub.textContent=t(T.sub||"");
    document.getElementById("score").innerHTML=scoreHtml(T);

    /* --- 桌機表格 --- */
    var cols='<col class="c-lab"/><col class="c-us"/>'+(T.cols||[]).map(function(){return '<col/>';}).join("");
    var head='<thead><tr><th class="lab"></th>'+
      '<th class="hd us"><b>'+tt(T.us&&T.us.name||"")+'</b><span>'+tt(T.us&&T.us.sub||"")+'</span></th>'+
      (T.cols||[]).map(function(c){return '<th class="hd"><b>'+tt(c.name||"")+'</b><span>'+tt(c.sub||"")+'</span></th>';}).join("")+
      '</tr></thead>';
    var span=2+(T.cols||[]).length;
    var lastG=null;
    var body='<tbody>'+(T.rows||[]).map(function(r,i){
      /* 分組小標：23 項規格一路平舖不好掃，依主題分段落 */
      var gh="";
      if(r.group&&r.group!==lastG){ lastG=r.group;
        gh='<tr class="grp"><td colspan="'+span+'">'+tt(r.group)+'</td></tr>'; }
      return gh+'<tr><td class="lab"><span class="no">'+pad(i)+'</span>'+tt(r.label||"")+'</td>'+
        '<td class="us">'+cellHtml(r.us)+'</td>'+
        (r.cells||[]).map(function(c){return '<td>'+cellHtml(c)+'</td>';}).join("")+'</tr>';
    }).join("")+
    /* 主打欄底部收在行動呼籲上，是比價表的通例 */
    '<tr class="ctarow"><td class="lab"></td><td class="us">'+
      '<a class="incta" href="/#contact">'+tt("索取樣品 / 型錄 →")+'</a></td>'+
      (T.cols||[]).map(function(){return '<td></td>';}).join("")+'</tr></tbody>';
    elTbl.innerHTML='<colgroup>'+cols+'</colgroup>'+head+body;

    /* --- 手機卡片 --- */
    lastG=null;
    elCards.innerHTML=(T.rows||[]).map(function(r,i){
      var gh="";
      if(r.group&&r.group!==lastG){ lastG=r.group; gh='<div class="cgrp">'+tt(r.group)+'</div>'; }
      var rows='<div class="crow us"><div class="who">'+tt(T.us&&T.us.name||"")+'</div>'+cellHtml(r.us)+'</div>'+
        (r.cells||[]).map(function(c,j){
          var col=(T.cols||[])[j]||{};
          return '<div class="crow"><div class="who">'+tt(col.name||"")+'</div>'+cellHtml(c)+'</div>';
        }).join("");
      return gh+'<div class="ccard"><h3><span>'+pad(i)+'</span>'+tt(r.label||"")+'</h3>'+rows+'</div>';
    }).join("");

    elSrcs.textContent=t(T.srcs||"");
  }

  elTabs.addEventListener("click",function(e){
    var b=e.target.closest("[data-i]"); if(!b)return;
    cur=parseInt(b.dataset.i,10); draw();
    /* 切換後把表格捲回最左，否則會停在上一個表格的橫向位置 */
    var w=document.querySelector(".cmp-wrap"); if(w)w.scrollLeft=0;
  });

  /* 英文字典：靜態文字用 data-i18n，表格內容走 EGRRA_I18N.t 的精確對照 */
  EGRRA_I18N.init({
    /* 標題與前言不列在這裡：它們由 draw() 依資料渲染，
       若同時掛 data-i18n，切語言時會被字典蓋掉，資料就改不動了。 */
    dict:{
      "cmp.lg1":"EGRRA product","cmp.lg2":"Best in this row (any brand)","cmp.lg3":"Has a clear limitation",
      "cmp.cta1":"Request samples / catalogue →","cmp.cta2":"View projects","cmp.cta3":"View certifications"
    },
    sel:[]
  });
  window.__redraw=draw;   /* 語言切換時重繪表格 */
  draw();

    /* 手機選單的處理程式已移到 i18n-sub.js（五個子頁共用）。
       兩份同時綁在同一顆按鈕上會 toggle 兩次互相抵消。 */
})();
</script>
