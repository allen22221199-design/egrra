<script>
(function(){
  var T=window.EGRRA_TEX;
  var DATA=(window.EGRRA_LOCAL&&window.EGRRA_LOCAL())||window.EGRRA_DEFAULT_DATA||{cases:[]};
  var CASES=DATA.cases||[];
  function cityOf(c){return (c.region||"").slice(0,2);}
  /* 一個案場可同時屬於多個類別（例如同時做防火門與消防箱）。
     新資料用 cats 陣列；舊資料只有單一 category，兩者都要能讀。 */
  function catsOf(c){
    if(c&&Array.isArray(c.cats)&&c.cats.length)return c.cats;
    return c&&c.category?[c.category]:[];
  }
  var cats=["全部"].concat(uniq([].concat.apply([],CASES.map(catsOf))));
  var cities=["全部"].concat(uniq(CASES.map(cityOf)));
  var state={cat:"全部",city:"全部"};

  function uniq(a){var o=[],s={};a.forEach(function(x){if(x&&!s[x]){s[x]=1;o.push(x);}});return o;}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function bg(c){return c.img?("url('"+c.img+"')"):T.tex(c.stone);}
  /* 縮圖版路徑（400px，卡片與縮圖列用，載入量約為原圖的 1/8）*/
  function th(src){return src?src.replace("img/cases/","img/cases/thumbs/"):src;}
  function bgTh(c){return c.img?("url('"+th(c.img)+"')"):T.tex(c.stone);}
  /* 該案場的所有照片：有 imgs 用 imgs，否則只有封面 */
  function shots(c){return (c&&c.imgs&&c.imgs.length)?c.imgs.slice():(c&&c.img?[c.img]:[]);}

  /* 中英切換：動態字串經 I 翻譯（zh 模式原樣傳回） */
  var I=window.EGRRA_I18N||{t:function(s){return s;},en:function(){return false;}};

  /* 標籤帶數量，且只顯示「在目前另一個條件下真的有案例」的選項，
     避免出現點下去是空白的死標籤。 */
  function chips(host,items,cur,onPick,countOf){
    host.innerHTML="";
    items.forEach(function(it){
      var n=countOf?countOf(it):1;
      if(n===0&&it!==cur&&it!=="全部")return;      /* 該條件下無案例 → 不顯示 */
      var b=document.createElement("button");b.className="fchip"+(it===cur?" on":"");
      b.textContent=I.t(it)+(it==="全部"?"":" ("+n+")");
      b.addEventListener("click",function(){onPick(it);});host.appendChild(b);
    });
  }
  function renderChips(){
    /* 沒有任何案例填地區時，「地區」只會剩一個「全部」，等於無作用 → 隱藏該列。
       但「共 N 件」的計數也在這一列裡，需先搬到「類別」列，否則會一起消失。 */
    var hasRegion=CASES.some(function(c){return !!cityOf(c);});
    var rowCity=document.getElementById("f-city"), cnt=document.getElementById("count");
    if(rowCity&&rowCity.parentElement){
      var row=rowCity.parentElement;
      if(!hasRegion){
        var catRow=document.getElementById("f-cat").parentElement;
        if(cnt&&cnt.parentElement!==catRow)catRow.appendChild(cnt);
        row.style.display="none";
      }else{
        if(cnt&&cnt.parentElement!==row)row.appendChild(cnt);
        row.style.display="";
      }
    }
    /* 各標籤的數量，以「另一個篩選的現值」為前提計算 */
    chips(document.getElementById("f-cat"),cats,state.cat,
      function(v){state.cat=v;render();},
      function(v){return CASES.filter(function(c){
        return (v==="全部"||catsOf(c).indexOf(v)>=0) && (state.city==="全部"||cityOf(c)===state.city);}).length;});
    chips(document.getElementById("f-city"),cities,state.city,
      function(v){state.city=v;render();},
      function(v){return CASES.filter(function(c){
        return (v==="全部"||cityOf(c)===v) && (state.cat==="全部"||catsOf(c).indexOf(state.cat)>=0);}).length;});
  }
  function match(c){
    if(state.cat!=="全部"&&catsOf(c).indexOf(state.cat)<0)return false;
    if(state.city!=="全部"&&cityOf(c)!==state.city)return false;
    return true;
  }
  function render(){
    renderChips();
    var grid=document.getElementById("grid");grid.innerHTML="";
    var list=CASES.filter(match);
    document.getElementById("count").textContent=I.en()?(list.length+" projects"):("共 "+list.length+" 件");
    if(!list.length){grid.innerHTML='<div class="noresult">'+(I.en()?"No projects match — try different filters 🙂":"找不到符合的案例，換個條件看看 🙂")+'</div>';return;}
    list.forEach(function(c){
      var card=document.createElement("div");card.className="card";
      var sub=[I.t(c.region),c.year].filter(Boolean).map(esc).join(' ・ ');
      /* 多類別時卡片並列顯示，讓訪客一眼看出這個案場做了哪些工程 */
      var tags='<div class="tags">'+catsOf(c).map(function(x){
        return '<span class="tag">'+esc(I.t(x))+'</span>';}).join("")+'</div>';
      card.innerHTML='<div class="th"><div class="pf-ov"></div>'+tags+'</div>'+
                     '<div class="cap"><h3>'+esc(c.title||I.t("實績案例"))+'</h3>'+(sub?'<p>'+sub+'</p>':'')+'</div>';
      card.querySelector(".th").style.backgroundImage=bgTh(c);
      card.addEventListener("click",function(){openModal(c);});
      grid.appendChild(card);
    });
  }

  var ov=document.getElementById("ov");
  var mimg=document.getElementById("m-img"),mshots=document.getElementById("m-shots"),
      mcount=document.getElementById("m-count"),mprev=document.getElementById("m-prev"),
      mnext=document.getElementById("m-next");
  var cmp=document.getElementById("m-cmp"),cmpA=document.getElementById("cmp-a"),
      cmpB=document.getElementById("cmp-b"),cmpHd=document.getElementById("cmp-hd"),
      cmpNt=document.getElementById("cmp-nt"),mmode=document.getElementById("m-mode");
  var gal=[],gi=0;          /* 相簿：所有現場照片 */
  var bas=[],bi=0;          /* 對比：施工前後成對的照片 */
  var mode="gal",pct=50,sweepT=0,dragging=false;

  /* ===== 施工前後對比 =====
     資料格式 case.ba = [{b:"施工前照片", a:"完工後照片", note:"位置說明(選填)"}]
     兩張都齊全才算一組；一組都沒有的案例完全不顯示切換鈕，維持原本的相簿體驗。 */
  function pairsOf(c){
    var a=(c&&c.ba)||[];
    return (Array.isArray(a)?a:[]).filter(function(x){return x&&x.b&&x.a;});
  }
  function setPct(p){
    pct=Math.max(0,Math.min(100,p));
    cmp.style.setProperty("--p",pct+"%");
    cmpHd.setAttribute("aria-valuenow",Math.round(pct));
  }
  /* 開啟時讓分隔線輕輕向右掃一次再回到中間，暗示「這條線可以拖」。
     沒有這個動作，多數訪客只會以為是一張普通的照片。 */
  function sweep(){
    if(sweepT)cancelAnimationFrame(sweepT);
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches){setPct(50);return;}
    var t0=null;
    sweepT=requestAnimationFrame(function step(ts){
      if(t0===null)t0=ts;
      var k=Math.min(1,(ts-t0)/900);
      setPct(50+18*Math.sin(k*Math.PI));
      sweepT=k<1?requestAnimationFrame(step):0;
    });
  }
  function dragTo(e){
    var r=cmp.getBoundingClientRect();
    if(r.width)setPct((e.clientX-r.left)/r.width*100);
  }
  cmp.addEventListener("pointerdown",function(e){
    if(sweepT){cancelAnimationFrame(sweepT);sweepT=0;}
    dragging=true;
    try{cmp.setPointerCapture(e.pointerId);}catch(_){}
    dragTo(e);e.preventDefault();
  });
  cmp.addEventListener("pointermove",function(e){if(dragging)dragTo(e);});
  ["pointerup","pointercancel","lostpointercapture"].forEach(function(t){
    cmp.addEventListener(t,function(){dragging=false;});
  });
  /* 把手可用鍵盤操作（焦點在把手上時，左右鍵＝移動分隔線而非換下一組） */
  cmpHd.addEventListener("keydown",function(e){
    var d=e.key==="ArrowLeft"?-4:e.key==="ArrowRight"?4:0;
    if(!d)return;
    e.preventDefault();e.stopPropagation();
    if(sweepT){cancelAnimationFrame(sweepT);sweepT=0;}
    setPct(pct+d);
  });
  mmode.querySelectorAll("button[data-m]").forEach(function(b){
    b.addEventListener("click",function(){setMode(b.dataset.m);});
  });

  function paintPair(){
    var p=bas[bi];if(!p)return;
    cmpB.style.backgroundImage="url('"+p.b+"')";
    cmpA.style.backgroundImage="url('"+p.a+"')";
    var parts=[];
    if(p.note)parts.push(esc(p.note));
    if(bas.length>1)parts.push(I.en()?("Comparison "+(bi+1)+" / "+bas.length):("第 "+(bi+1)+" / "+bas.length+" 組"));
    cmpNt.innerHTML=parts.join("　·　");
    sweep();
    mshots.querySelectorAll(".s").forEach(function(s,k){s.classList.toggle("on",k===bi);});
  }
  function paintShot(){
    if(!gal.length)return;
    mimg.style.backgroundImage="url('"+gal[gi]+"')";
    var many=gal.length>1;
    mcount.textContent=many?(gi+1)+" / "+gal.length:"";
    mcount.style.display=many?"":"none";
    mprev.style.display=mnext.style.display=many?"":"none";
    mshots.querySelectorAll(".s").forEach(function(s,k){s.classList.toggle("on",k===gi);});
  }
  /* 縮圖列：相簿模式列出每張照片；對比模式列出每一組（左半＝前、右半＝後） */
  function renderShots(){
    mshots.innerHTML="";
    if(mode==="cmp"){
      if(bas.length<2)return;
      bas.forEach(function(p,k){
        var s=document.createElement("div");s.className="s pr";
        var i1=document.createElement("i"),i2=document.createElement("i");
        i1.style.backgroundImage="url('"+th(p.b)+"')";
        i2.style.backgroundImage="url('"+th(p.a)+"')";
        s.appendChild(i1);s.appendChild(i2);
        if(p.note)s.title=p.note;
        s.addEventListener("click",function(){bi=k;paintPair();});
        mshots.appendChild(s);
      });
      return;
    }
    if(gal.length<2)return;
    gal.forEach(function(src,k){
      var s=document.createElement("div");s.className="s";
      s.style.backgroundImage="url('"+th(src)+"')";
      s.addEventListener("click",function(){gi=k;paintShot();});
      mshots.appendChild(s);
    });
  }
  function setMode(m){
    mode=(m==="cmp"&&bas.length)?"cmp":"gal";
    cmp.classList.toggle("on",mode==="cmp");
    mimg.classList.toggle("cmpmode",mode==="cmp");
    mmode.querySelectorAll("button[data-m]").forEach(function(b){
      b.classList.toggle("on",b.dataset.m===mode);});
    renderShots();
    if(mode==="cmp"){
      mcount.style.display="none";            /* 對比模式的組數改寫在下方說明列 */
      var many=bas.length>1;
      mprev.style.display=mnext.style.display=many?"":"none";
      paintPair();
    }else if(gal.length){
      paintShot();
    }else{
      mcount.style.display="none";
      mprev.style.display=mnext.style.display="none";
    }
  }
  function stepShot(d){if(gal.length<2)return;gi=(gi+d+gal.length)%gal.length;paintShot();}
  function stepPair(d){if(bas.length<2)return;bi=(bi+d+bas.length)%bas.length;paintPair();}
  function step(d){if(mode==="cmp")stepPair(d);else stepShot(d);}
  function openModal(c){
    gal=shots(c);gi=0;
    bas=pairsOf(c);bi=0;
    mimg.style.backgroundImage=gal.length?("url('"+gal[0]+"')"):bg(c);
    mmode.classList.toggle("on",bas.length>0);
    /* 有前後對比的案例就直接停在對比畫面 —— 這是訪客最想看到的一頁；
       想看完整現場照片再按「現場照片」切回去。 */
    setMode(bas.length?"cmp":"gal");
    document.getElementById("m-cat").textContent=
      catsOf(c).map(function(x){return I.t(x);}).join(" ・ ")||I.t("實績案例");
    document.getElementById("m-title").textContent=(c.title||I.t("實績案例"));
    document.getElementById("m-desc").textContent=c.desc||(I.en()
      ?"Finished with EGRRA panels — Class-1 fire-rated, combining fire safety with design quality. Actual materials and dimensions per site conditions."
      :"本案以藝格板進行空間美化，通過耐燃一級測試，兼顧防火機能與設計質感。實際用料與尺寸依現場為準。");
    document.getElementById("m-spec").innerHTML=
      row(I.t("地區"),I.t(c.region)||"—")+
      row(I.t("類別"),catsOf(c).map(function(x){return I.t(x);}).join(" ・ ")||"—")+
      row(I.t("年份"),c.year||"—")+
      (gal.length>1?row(I.t("照片"),I.en()?String(gal.length):(gal.length+" 張")):"")+
      (bas.length?row(I.en()?"Before / After":"施工前後",
        I.en()?(bas.length+(bas.length>1?" comparisons":" comparison")):(bas.length+" 組")):"");
    ov.classList.add("show");
  }
  function row(k,v){return '<div class="row"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>';}
  document.getElementById("m-close").addEventListener("click",function(){ov.classList.remove("show");});
  mprev.addEventListener("click",function(e){e.stopPropagation();step(-1);});
  mnext.addEventListener("click",function(e){e.stopPropagation();step(1);});
  mimg.addEventListener("click",function(e){if(e.target===mimg)step(1);});
  ov.addEventListener("click",function(e){if(e.target===ov)ov.classList.remove("show");});
  document.addEventListener("keydown",function(e){
    if(!ov.classList.contains("show"))return;
    if(e.key==="Escape")ov.classList.remove("show");
    /* 焦點在拖曳把手上時，左右鍵留給把手移動分隔線（見上方 cmpHd 的 keydown） */
    else if(document.activeElement===cmpHd)return;
    else if(e.key==="ArrowLeft")step(-1);
    else if(e.key==="ArrowRight")step(1);
  });

  window.__redraw=render;   /* 語言切換時由 i18n 呼叫重繪 */
  render();

  /* ===== 單一案例的深層連結 ?case=c8 =====
     兩個用途：
     1. 業務可以把某一件案例的連結單獨傳給客戶，對方點開直接看到那件。
     2. 舊站 egrra.com 的 /portfolio-item/… 轉址過來時能精準落在對應案例，
        而不是全部倒進列表頁（轉址到列表頁會被 Google 當成軟性 404，
        累積的權重轉不過來）。
     找不到對應 id 時安靜略過，讓訪客停在列表就好，不要跳錯的案例。 */
  function caseParam(){
    try{ return new URLSearchParams(location.search).get("case")||""; }
    catch(e){ var m=/[?&]case=([^&]*)/.exec(location.search); return m?decodeURIComponent(m[1]):""; }
  }
  function setParam(id){
    if(!history.replaceState)return;
    var u=location.pathname+(id?"?case="+encodeURIComponent(id):"")+location.hash;
    try{ history.replaceState(null,"",u); }catch(e){}
  }
  var _open=openModal;
  openModal=function(c){ _open(c); setParam(c&&c.id); };
  document.getElementById("m-close").addEventListener("click",function(){setParam("");});
  ov.addEventListener("click",function(e){if(e.target===ov)setParam("");});
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&!ov.classList.contains("show"))setParam("");
  });

  (function(){
    var id=caseParam(); if(!id)return;
    for(var i=0;i<CASES.length;i++){
      if(String(CASES[i].id)===String(id)){ openModal(CASES[i]); return; }
    }
    setParam("");   /* id 已失效（案例被刪掉）→ 清掉網址參數，留在列表 */
  })();
})();
</script>
<script src="line-widget.js"></script>
<script src="chatbot.js"></script>
<script src="tracker.js" defer></script>
